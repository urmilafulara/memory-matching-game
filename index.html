<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Matching Game</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body class="medium">

    <!-- Dark Mode -->

    <button
        id="darkToggle"
        class="dark-btn"
        onclick="toggleDark()">
        🌙
    </button>

    <!-- Heading -->

    <h1 id="gameTitle">
        🧠 Memory Matching Game 🎯
    </h1>

    <p class="subtitle">
        Match all pairs as fast as possible! 🚀
    </p>

    <!-- Player -->

    <div class="player-box">

        👤 <span id="player">Player</span>

    </div>

    <!-- Stats -->

    <div class="stats">

        <div class="stat-card">

            <div>🎯</div>

            <small>Moves</small>

            <h3 id="moves">0</h3>

        </div>

        <div class="stat-card">

            <div>⏱</div>

            <small>Time</small>

            <h3>
                <span id="time">0</span>s
            </h3>

        </div>

        <div class="stat-card">

            <div>🏆</div>

            <small>Best</small>

            <h3 id="bestScore">--</h3>

        </div>

    </div>

    <!-- Controls -->

    <div class="controls">

        <select id="difficulty">

            <option value="8">🐾 Easy</option>

            <option value="10" selected>😀 Medium</option>

            <option value="18">🚀 Hard</option>

        </select>

        <button onclick="startGame()">
            ▶ Start
        </button>

        <button
            id="pauseBtn"
            onclick="togglePause()">
            ⏸ Pause
        </button>

        <button onclick="stopGame()">
            ⏹ Stop
        </button>

    </div>

    <!-- Status -->

    <p
        id="gameStatus"
        class="status">
    </p>

    <!-- Game Board -->

    <div
        id="board"
        class="game-board">
    </div>

    <!-- Win Popup -->

    <div
        id="popup"
        class="popup">

        <div class="popup-content">

            <h2>
                🎉 Congratulations!
            </h2>

            <p id="result"></p>

            <button onclick="chooseDifficulty()">
                🔄 Play Again
            </button>

        </div>

    </div>

    <!-- Name Popup -->

    <div
        id="namePopup"
        class="popup show">

        <div class="popup-content">

            <h2>
                👋 Welcome
            </h2>

            <p>
                Enter your name
            </p>

            <input
                id="playerName"
                type="text"
                maxlength="20"
                placeholder="Your Name">

            <br><br>

            <button onclick="startGameWithName()">
                🎮 Start Game
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
